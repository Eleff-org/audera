repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: false

      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        types: [python]
        require_serial: false

      # `shellcheck-py` is a wheel, so `uvx` resolves it the same way locally and on a runner, with
      # no apt or Docker prerequisite.
      #
      # Pinned to `warning`, since every `info` finding in `os/dietpi/` is deliberate: the setup
      # scripts `source` libraries they curl to `/tmp` at runtime (SC1091), the logo prints literal
      # backslashes (SC2028), and `provision.sh` sends single-quoted commands meant to expand on the
      # device rather than on the client (SC2016, SC2029).
      - id: shellcheck
        name: shellcheck
        entry: uvx --from shellcheck-py shellcheck --severity=warning
        language: system
        types: [shell]
        require_serial: false
