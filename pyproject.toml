[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audera"
version = "0.1.0b1"
description = "Audera is a new era of composable audio systems that brings open-protocols to your own hardware for multi-room synchronous playback."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tom Eleff" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "coolname==4.2.0",
    "duckdb==1.5.1",
    "pytensils==1.4.0",
    "netifaces==0.11.0",
    "nicegui==3.10.0",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "websockets==16.0",
    "pyyaml==6.0.3",
    "pytz==2026.1.post1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "zeroconf>=0.143.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.5.1",
    "ruff==0.15.10",
    "ty==0.0.29",
    "pytest==9.0.3",
    "pytest-asyncio>=0.24.0",
    "testcontainers==4.14.2",
    "respx==0.23.1",
]

[project.urls]
Issues = "https://github.com/Eleff-org/audera/issues"
Releases = "https://github.com/Eleff-org/audera/releases"

[project.scripts]
audera = "audera.cli.audera:main"

[tool.hatch.build.targets.wheel]
packages = ["audera"]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 129

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
